# Container-only MVP factory overlay (E2-T1, E3-T1, ADR 0073).
# Layer on top of compose.yaml (and optionally compose.live.yaml) for real OIDC behind Caddy TLS,
# model-pinned agent containers (adam-architect, adam-coder-fast, adam-coder-light), factory-board,
# and factory-mcp — strictly plain OCI containers + Compose + Postgres + Caddy (no K8s/Helm/CNPG).
#
# Required env vars (see .env.factory.example):
#   OAUTH2_PROXY_OIDC_ISSUER_URL, OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET,
#   OAUTH2_PROXY_COOKIE_SECRET, POSTGRES_PASSWORD, MODEL_BASE_URL, MODEL,
#   ARCHITECT_A2A_TOKEN, CODER_FAST_A2A_TOKEN, CODER_LIGHT_A2A_TOKEN, GITHUB_WEBHOOK_SECRET.
#
# Usage:
#   docker compose -f compose.yaml -f compose.live.yaml -f compose.factory.yaml --env-file .env.factory --profile app up -d --build --wait

x-factory-adam-image: &factory-adam-image
  "${ADAM_CODER_IMAGE:-ghcr.io/vymalo/another-adam-rs/coder:sha-9f90f1e@sha256:8352a52c2a7e41a00af71274b783e7d0fb5277bb1ffbd25921f3d64d50c876ea}"

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"

  agents-postgres:
    profiles: !override []
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"

  coder-postgres:
    profiles: !override []
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"

  # Disable local mock OIDC issuer in factory mode; real OIDC is required.
  mock-oidc:
    profiles: !override [disabled]
    deploy:
      replicas: 0

  # Keep offline model/GitHub/CI mocks disabled even if compose.live.yaml is omitted.
  mock-openai:
    profiles: !override [offline-mocks]
  mock-github:
    profiles: !override [offline-mocks]
  mock-github-mcp:
    profiles: !override [offline-mocks]
  git-server:
    profiles: !override [offline-mocks]
  mock-ci:
    profiles: !override [offline-mocks]
  mock-model:
    profiles: !override [offline-mocks]

  oauth2-proxy:
    profiles: !override []
    depends_on: !override {}
    environment: !override
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${OAUTH2_PROXY_OIDC_ISSUER_URL:?set OAUTH2_PROXY_OIDC_ISSUER_URL in .env}"
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET in .env}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}"
      OAUTH2_PROXY_REDIRECT_URL: "${OAUTH2_PROXY_REDIRECT_URL:-https://127.0.0.1:${EDGE_HTTPS_PORT:-8443}/oauth2/callback}"
      OAUTH2_PROXY_EXTRA_JWT_ISSUERS: "${OAUTH2_PROXY_EXTRA_JWT_ISSUERS:-${OAUTH2_PROXY_OIDC_ISSUER_URL}=${OAUTH2_PROXY_CLIENT_ID}}"
    command: !override
      - --http-address=0.0.0.0:4180
      - --upstream=static://202
      - --provider=oidc
      - --code-challenge-method=S256
      - --email-domain=*
      - --cookie-secure=${OAUTH2_PROXY_COOKIE_SECURE:-true}
      - --set-authorization-header=true
      - --skip-jwt-bearer-tokens=true
      - --skip-provider-button=true
      - --silence-ping-logging=true

  edge:
    profiles: !override []
    ports: !override
      - "127.0.0.1:${EDGE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${EDGE_HTTPS_PORT:-8443}:8443"
    volumes: !override
      - ./dev/Caddyfile.factory:/etc/caddy/Caddyfile:ro
    depends_on:
      factory-board:
        condition: service_started
      factory-mcp:
        condition: service_started

  web:
    profiles: !override []

  # Override inherited MCP_ALLOW_INSECURE="true" on legacy agent services so factory stack never allows plaintext non-loopback MCP.
  coder:
    profiles: !override []
    depends_on: !override
      coder-postgres:
        condition: service_healthy
    environment:
      MCP_ALLOW_INSECURE: "false"

  github-mcp:
    profiles: !override []

  chat:
    profiles: !override []
    depends_on: !override
      agents-postgres:
        condition: service_healthy
    environment:
      MCP_ALLOW_INSECURE: "false"

  researcher:
    profiles: !override []
    depends_on: !override
      agents-postgres:
        condition: service_healthy
    environment:
      MCP_ALLOW_INSECURE: "false"

  browser-obscura:
    profiles: !override []

  browser-site:
    profiles: !override []

  browser:
    profiles: !override []
    depends_on: !override
      browser-obscura:
        condition: service_started
      agents-postgres:
        condition: service_healthy
    environment:
      MCP_ALLOW_INSECURE: "false"

  factory-board:
    build:
      context: "${FACTORY_BOARD_CONTEXT:-../factory-board}"
    image: "${FACTORY_BOARD_IMAGE:-another-agentic-system/factory-board:dev}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN_ADDR: 0.0.0.0:8090
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/board"
      OIDC_ISSUER: "${OAUTH2_PROXY_OIDC_ISSUER_URL:?set OAUTH2_PROXY_OIDC_ISSUER_URL in .env}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}}"
      OIDC_REQUIRE_KID: "${OIDC_REQUIRE_KID:-true}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}"
      DEPLOY_WEBHOOK_SECRET: "${DEPLOY_WEBHOOK_SECRET:-${GITHUB_WEBHOOK_SECRET}}"
      RUST_LOG: "${RUST_LOG:-info}"

  factory-mcp:
    build:
      context: "${FACTORY_MCP_CONTEXT:-../factory-mcp}"
    image: "${FACTORY_MCP_IMAGE:-another-agentic-system/factory-mcp:dev}"
    environment:
      LISTEN_ADDR: 0.0.0.0:8091
      LOG_FORMAT: json
      OIDC_ISSUER: "${OAUTH2_PROXY_OIDC_ISSUER_URL:?set OAUTH2_PROXY_OIDC_ISSUER_URL in .env}"
      OIDC_JWKS_URL: "${OIDC_JWKS_URL:-${OAUTH2_PROXY_OIDC_ISSUER_URL}/.well-known/jwks.json}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}}"
      OIDC_REQUIRE_KID: "${OIDC_REQUIRE_KID:-true}"
      MCP_RESOURCE_URI: "${FACTORY_MCP_RESOURCE_URI:-https://edge:8443/factory-mcp/mcp}"
      MCP_APPROVAL_BASE_URL: "${FACTORY_MCP_APPROVAL_BASE_URL:-https://127.0.0.1:${EDGE_HTTPS_PORT:-8443}/factory-mcp}"
      GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      BLUEPRINT_SOURCE_URL: "${BLUEPRINT_SOURCE_URL:-https://github.com/vymalo/app-factory-blueprint.git}"
      DEPLOY_WEBHOOK_URL: "${DEPLOY_WEBHOOK_URL:-http://factory-board:8090/webhooks/deploy}"
      DEPLOY_WEBHOOK_TOKEN: "${DEPLOY_WEBHOOK_TOKEN:-${DEPLOY_WEBHOOK_SECRET:-${GITHUB_WEBHOOK_SECRET}}}"

  orchestrator:
    profiles: !override []
    # Decoupled from individual agent containers (cards are resolved lazily on demand).
    depends_on: !override
      postgres:
        condition: service_healthy
    volumes: !override
      - ${ORCH_FACTORY_CONFIG_FILE:-./dev/orchestrator.factory.yaml}:/etc/orchestrator/config.yaml:ro
      - ./dev/agents.factory.yaml:/etc/orchestrator/agents.factory.yaml:ro
      - ./dev/mcp-tokens.yaml:/etc/orchestrator/mcp-tokens.yaml:ro
      - orchestrator-artifacts:/var/lib/orchestrator/artifacts
    environment:
      ORCH_CONFIG_FILE: /etc/orchestrator/config.yaml
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/orch"
      AGENTS_FILE: /etc/orchestrator/agents.factory.yaml
      THREAD_TOOLS_URL: https://edge:8443
      THREAD_TOOLS_ALLOWED_HOSTS: edge:8443,edge,127.0.0.1:8443,localhost:8443
      ORCH_PUBLIC_URL: "${ORCH_PUBLIC_URL:-https://127.0.0.1:${EDGE_HTTPS_PORT:-8443}}"
      ARCHITECT_A2A_TOKEN: "${ARCHITECT_A2A_TOKEN:?set ARCHITECT_A2A_TOKEN in .env}"
      CODER_FAST_A2A_TOKEN: "${CODER_FAST_A2A_TOKEN:?set CODER_FAST_A2A_TOKEN in .env}"
      CODER_LIGHT_A2A_TOKEN: "${CODER_LIGHT_A2A_TOKEN:?set CODER_LIGHT_A2A_TOKEN in .env}"
      WEBHOOK_GITHUB_SECRETS: "${WEBHOOK_GITHUB_SECRETS:-${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}}"
      WEBHOOK_GENERIC_SECRETS: "${WEBHOOK_GENERIC_SECRETS:-${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}}"
      MCP_TOKEN_DEV: "${MCP_TOKEN_DEV:?set MCP_TOKEN_DEV in .env}"
      ORCH_MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env}"
      ORCH_MODEL_API_KEY: "${MODEL_API_KEY:-}"
      ORCH_TITLE_MODEL: "${TITLE_MODEL:-${MODEL:?set MODEL in .env}}"

  # ---- Model-pinned agent containers (E3-T1, ADR 0073) -----------------------------------------------------
  adam-architect:
    image: *factory-adam-image
    platform: linux/amd64
    entrypoint: ["tini", "--", "adam-agent"]
    depends_on:
      agents-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@agents-postgres:5432/agents"
      MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL: "${ARCHITECT_MODEL:-${MODEL:?set MODEL or ARCHITECT_MODEL in .env}}"
      A2A_BEARER_TOKENS: "${ARCHITECT_A2A_TOKEN:?set ARCHITECT_A2A_TOKEN in .env}"
      PUBLIC_URL: http://adam-architect:8080/
      ADAM_AGENT_DIR: /etc/adam/agent
      FACTORY_MCP_TOKEN: "${FACTORY_MCP_TOKEN:-}"
    volumes:
      - ${ARCHITECT_AGENT_DIR:-./dev/agents/architect/agent}:/etc/adam/agent:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  adam-coder-fast:
    image: *factory-adam-image
    platform: linux/amd64
    depends_on:
      coder-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@coder-postgres:5432/coder"
      MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL: "${CODER_FAST_MODEL:-${MODEL:?set MODEL or CODER_FAST_MODEL in .env}}"
      GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_OWNERS: "${GITHUB_APP_OWNERS:-}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_ID:+/run/github-app/key.pem}"
      ALLOW_COMMANDS_NEXT_TO_SECRETS: "${ALLOW_COMMANDS_NEXT_TO_SECRETS:-false}"
      CREATE_REPO_OWNERS: "${CREATE_REPO_OWNERS:-}"
      ALLOWED_REPO_HOSTS: "${ALLOWED_REPO_HOSTS:-github.com}"
      A2A_BEARER_TOKENS: "${CODER_FAST_A2A_TOKEN:?set CODER_FAST_A2A_TOKEN in .env}"
      PUBLIC_URL: http://adam-coder-fast:8080/
      WORKSPACE_ROOT: /work
      ADAM_AGENT_DIR: /etc/adam/agent
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-adam-coder}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-adam-coder@users.noreply.github.com}"
      PR_DRAFT: "${PR_DRAFT:-false}"
    volumes:
      - coder-fast-work:/work
      - ${CODER_FAST_AGENT_DIR:-./dev/coder/agent}:/etc/adam/agent:ro
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-./dev/coder/no-github-app-key.pem}:/run/github-app/key.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  github-mcp-fast:
    image: *factory-adam-image
    platform: linux/amd64
    entrypoint: ["tini", "--", "github-mcp-server"]
    command:
      - http
      - --read-only
      - --toolsets
      - context,repos,issues,pull_requests
      - --listen-host
      - 127.0.0.1
      - --port
      - "8082"
    network_mode: "service:adam-coder-fast"
    restart: unless-stopped
    depends_on:
      adam-coder-fast:
        condition: service_started
    environment:
      GITHUB_HOST: "${GITHUB_HOST:-}"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  adam-coder-light:
    image: *factory-adam-image
    platform: linux/amd64
    depends_on:
      coder-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@coder-postgres:5432/coder"
      MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL: "${CODER_LIGHT_MODEL:-${MODEL:?set MODEL or CODER_LIGHT_MODEL in .env}}"
      GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_OWNERS: "${GITHUB_APP_OWNERS:-}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_ID:+/run/github-app/key.pem}"
      ALLOW_COMMANDS_NEXT_TO_SECRETS: "${ALLOW_COMMANDS_NEXT_TO_SECRETS:-false}"
      CREATE_REPO_OWNERS: "${CREATE_REPO_OWNERS:-}"
      ALLOWED_REPO_HOSTS: "${ALLOWED_REPO_HOSTS:-github.com}"
      A2A_BEARER_TOKENS: "${CODER_LIGHT_A2A_TOKEN:?set CODER_LIGHT_A2A_TOKEN in .env}"
      PUBLIC_URL: http://adam-coder-light:8080/
      WORKSPACE_ROOT: /work
      ADAM_AGENT_DIR: /etc/adam/agent
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-adam-coder}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-adam-coder@users.noreply.github.com}"
      PR_DRAFT: "${PR_DRAFT:-false}"
    volumes:
      - coder-light-work:/work
      - ${CODER_LIGHT_AGENT_DIR:-./dev/coder/agent}:/etc/adam/agent:ro
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-./dev/coder/no-github-app-key.pem}:/run/github-app/key.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  github-mcp-light:
    image: *factory-adam-image
    platform: linux/amd64
    entrypoint: ["tini", "--", "github-mcp-server"]
    command:
      - http
      - --read-only
      - --toolsets
      - context,repos,issues,pull_requests
      - --listen-host
      - 127.0.0.1
      - --port
      - "8082"
    network_mode: "service:adam-coder-light"
    restart: unless-stopped
    depends_on:
      adam-coder-light:
        condition: service_started
    environment:
      GITHUB_HOST: "${GITHUB_HOST:-}"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  coder-fast-work:
  coder-light-work:
